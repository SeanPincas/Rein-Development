services:
  rein-dev:
    image: node:22-alpine
    working_dir: /app
    env_file:
      - ./frontend/.env.local
    environment:
      NODE_ENV: development
      HOSTNAME: 0.0.0.0
      PORT: 3000
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - rein_node_modules:/app/node_modules
      - rein_next:/app/.next
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"

volumes:
  rein_node_modules:
  rein_next:
