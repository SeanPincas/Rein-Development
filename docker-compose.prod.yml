services:
  rein:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - frontend_env
    env_file:
      - ./frontend/.env.local
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${REIN_PROD_PORT:-3001}:3000"
    restart: unless-stopped

secrets:
  frontend_env:
    file: ./frontend/.env.local
